# The only line you should normally need to edit in this file is the
# dependency install step below, when your project needs a library beyond
# Qt (e.g. Boost, SQLite).

name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
          # Add other libraries your project needs here, for example:
          # sudo apt-get install -y libboost-all-dev
          # sudo apt-get install -y libsqlite3-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
